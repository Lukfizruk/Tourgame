
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourgame - Gaming Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                300: '#86efac',
                400: '#4ade80',
                500: '#065f46', // Темный изумрудный
                600: '#059669',
                700: '#047857',
                800: '#064e3b', // Еще более темный
                900: '#022c22',
              }
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --bg-color: #020617;
            --text-color: #f8fafc;
            --card-bg: rgba(15, 23, 42, 0.4);
            --card-border: rgba(6, 78, 59, 0.2);
            --accent-color: #065f46;
            --muted-text: #94a3b8;
        }

        .light-theme {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(6, 78, 59, 0.15);
            --accent-color: #064e3b;
            --muted-text: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        
        .num-font {
            font-family: 'Inter', sans-serif !important;
            letter-spacing: -0.02em;
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(6, 95, 70, 0.3);
        }
        
        .light-theme .glow-text {
            text-shadow: 0 0 8px rgba(6, 95, 70, 0.1);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
        }
        
        .light-theme .glass-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-scroll {
            display: flex;
            width: max-content;
            animation: scroll 30s linear infinite;
        }
        .animate-scroll:hover {
            animation-play-state: paused;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
