
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourgame - Gaming Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#f0fff9',
                100: '#ccffeb',
                200: '#99ffd8',
                300: '#66ffc5',
                400: '#33ffb1',
                500: '#00ff9d', // Максимально яркий неоновый зеленый
                600: '#00e68e',
                700: '#00cc7e',
                800: '#00b36f',
                900: '#00995f',
              }
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --bg-color: #020617;
            --text-color: #f8fafc;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(0, 255, 157, 0.25);
            --accent-color: #00ff9d;
            --muted-text: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
        }
        
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        
        .num-font {
            font-family: 'Inter', sans-serif !important;
            letter-spacing: -0.02em;
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.6), 0 0 40px rgba(0, 255, 157, 0.2);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-scroll {
            display: flex;
            width: max-content;
            animation: scroll 35s linear infinite;
        }
        .animate-scroll:hover {
            animation-play-state: paused;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .neon-glow {
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.4);
        }
        .hover-neon:hover {
            box-shadow: 0 0 25px rgba(0, 255, 157, 0.5);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
